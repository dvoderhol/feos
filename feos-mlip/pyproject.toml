[project]
name = "feos-mlip"
version = "0.1.0"
description = "Machine-learned interatomic potential (MLIP) external potentials for feos classical DFT in periodic frameworks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feos>=0.11",
    "si-units>=0.11.0",
    "numpy",
    "scipy",
    "ase",
    "spglib",
]

[project.optional-dependencies]
mace = ["torch", "mace-torch"]
nequip = ["torch", "vesin"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feos_mlip"]
